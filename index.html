<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downpour</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio src="rain.mp3" id="rain-sound" loop></audio>
    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">
        <label>Rain <input type="range" id="amount" min="0" max="1" step="0.01" value="0.7"></label>
        <label>Wind <input type="range" id="wind" min="-1" max="1" step="0.01" value="0.3"></label>
        <label><input type="checkbox" id="lightning" checked> Lightning</label>
        <label><input type="checkbox" id="follow" checked> Wind follows mouse</label>
    </div>
    <p class="hint">click for sound · H hides the controls</p>

    <script src="script.js"></script>
    <script src="audio.js"></script>
</body>
</html>
